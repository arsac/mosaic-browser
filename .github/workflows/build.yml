name: build

# A full Chromium build takes ~13h on a free runner, past the 6h job limit, so
# it is chained: prep prepares the tree, then each build_part_NN restores it,
# runs ninja for ~5h, and saves it for the next part, which only runs while the
# previous one reported status 'running'. Pattern and scripts from
# ungoogled-chromium-portablelinux.
#
# A tag <UC_TAG>.<n> (e.g. 154.0.8037.57-1.1) publishes a GitHub release with
# the attested tarball. workflow_dispatch builds, smokes and attests the same
# artifacts (version <UC_TAG>-g<sha>) without a release. A pull request that
# touches the build inputs, or a dispatch with prepare_only, runs only prep:
# every pin resolves, every patch applies, gn accepts the tree and the patched
# sources compile. A dispatch with resume_from_run starts from the tree a
# failed run saved (same ungoogled tag, tarball and ninja), redoing only the
# patches that changed since.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+.[0-9]+"
  pull_request:
    paths:
      - versions.env
      - flags.gn
      - patches/**
      - scripts/**
      - docker/**
      - .github/**
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Stop after prep (the pull-request gate)
        type: boolean
        default: false
      resume_from_run:
        description: Run id whose saved build tree to continue from (within its 3-day retention)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  ARCH: x64

defaults:
  run:
    shell: bash

jobs:
  prep:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Downloading another run's build tree (resume_from_run).
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      full_build: ${{ steps.version.outputs.full_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          . versions.env
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            case "${GITHUB_REF_NAME}" in
              "${UC_TAG}".*) version="${GITHUB_REF_NAME}" ;;
              *) echo "::error::tag ${GITHUB_REF_NAME} is not ${UC_TAG}.<n> (UC_TAG from versions.env)"; exit 1 ;;
            esac
          else
            version="${UC_TAG}-g${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "chromium_version=${CHROMIUM_VERSION}" >> "$GITHUB_OUTPUT"
          full_build=true
          if [ "${GITHUB_EVENT_NAME}" = pull_request ] || [ "${PREPARE_ONLY}" = true ]; then
            full_build=false
          fi
          echo "full_build=${full_build}" >> "$GITHUB_OUTPUT"
        env:
          PREPARE_ONLY: ${{ inputs.prepare_only }}

      - name: Lint stealth patches
        run: scripts/lint-patches.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: chromium-builder
          build-args: CHROMIUM_VERSION=${{ steps.version.outputs.chromium_version }}
          outputs: type=docker,dest=/tmp/chromium-builder.tar
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max

      - name: Upload builder image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ env.ARCH }}
          path: /tmp/chromium-builder.tar
          retention-days: 1

      - name: Prepare build tree
        uses: ./.github/actions/build
        with:
          prepare-only: true
          save-cache: ${{ steps.version.outputs.full_build }}
          resume-run-id: ${{ inputs.resume_from_run }}

  build_part_01:
    runs-on: ubuntu-24.04
    needs: prep
    if: needs.prep.outputs.full_build == 'true'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_02:
    runs-on: ubuntu-24.04
    needs: build_part_01
    if: needs.build_part_01.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_03:
    runs-on: ubuntu-24.04
    needs: build_part_02
    if: needs.build_part_02.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_04:
    runs-on: ubuntu-24.04
    needs: build_part_03
    if: needs.build_part_03.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_05:
    runs-on: ubuntu-24.04
    needs: build_part_04
    if: needs.build_part_04.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_06:
    runs-on: ubuntu-24.04
    needs: build_part_05
    if: needs.build_part_05.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_07:
    runs-on: ubuntu-24.04
    needs: build_part_06
    if: needs.build_part_06.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_08:
    runs-on: ubuntu-24.04
    needs: build_part_07
    if: needs.build_part_07.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_09:
    runs-on: ubuntu-24.04
    needs: build_part_08
    if: needs.build_part_08.outputs.status == 'running'
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        id: build

  build_part_10:
    runs-on: ubuntu-24.04
    needs: build_part_09
    if: needs.build_part_09.outputs.status == 'running'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/build
        with:
          final: true

  package:
    runs-on: ubuntu-24.04
    needs: [prep, build_part_01, build_part_10]
    # build_part_10 is skipped when an earlier part completed the build; any
    # failed ancestor still fails this condition. Part 1 must have run, or this
    # was a prep-only run.
    if: ${{ !cancelled() && !failure() && needs.build_part_01.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.build_part_10.result) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-cache-${{ env.ARCH }}
          path: .github/cache/

      - name: Import build cache
        run: bash ./.github/scripts/import-cache.sh

      - name: Package
        run: scripts/package.sh "${VERSION}"

      # Smoke the tarball, not the build tree: it proves the package is complete.
      # Headed on Xvfb as well, since the WebGL spoof reads as empty without a
      # display.
      - name: Smoke test
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke"
          tar -xJf "build/release/mosaic-browser-${VERSION}-linux-x64.tar.xz" -C "${RUNNER_TEMP}/smoke" --strip-components=1
          "${RUNNER_TEMP}/smoke/chrome" --version
          python3 scripts/smoke.py "${RUNNER_TEMP}/smoke/chrome"
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a python3 scripts/smoke.py --headed "${RUNNER_TEMP}/smoke/chrome"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            build/release/mosaic-browser-${{ env.VERSION }}-linux-x64.tar.xz
            build/release/mosaic-browser-${{ env.VERSION }}-linux-x64.tar.xz.sha256
            build/release/version.json
          if-no-files-found: error
          compression-level: 0

      # After the upload, so an attestation fault cannot discard a finished
      # 13h build: the files stay downloadable and attestable by a re-run.
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/release/mosaic-browser-${{ env.VERSION }}-linux-x64.tar.xz
            build/release/version.json

  release:
    runs-on: ubuntu-24.04
    needs: [prep, package]
    # Explicit status check: with the implicit success(), the build parts that
    # were skipped upstream would skip this job too.
    if: ${{ !cancelled() && !failure() && needs.package.result == 'success' && github.ref_type == 'tag' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --notes "Verify with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
